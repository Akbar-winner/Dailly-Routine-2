    <!-- 1-OYNA: HAFTA KUNLARI -->
    <div id="dayModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-[440px] text-center">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2">Hafta kunini tanlang</h2>
            <p class="text-gray-500 text-sm mb-6">Bugun qaysi kun? (Yakshanbadan tashqari)</p>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <button onclick="selectDay('Dushanba')"

                <button onclick="selectDay('Seshanba')"

                <button onclick="selectDay('Chorshanba')"

                <button onclick="selectDay('Payshanba')"
                    class="py-3 px-4 bg-gray-100 hover:bg-[#0E0E0E] hover:text-white text-gray-800 font-semibold rounded-xl transition active:scale-95">Payshanba</button>

                    class="py-3 px-4 bg-gray-100 hover:bg-[#0E0E0E] hover:text-white text-gray-800 font-semibold rounded-xl transition active:scale-95">Juma</button>

                    class="py-3 px-4 bg-gray-100 hover:bg-[#0E0E0E] hover:text-white text-gray-800 font-semibold rounded-xl transition active:scale-95">Shanba</button>
            </div>
        </div>
    </div>

    <div id="breakModal" class="hidden fixed inset-0 bg-black/70 items-center justify-center z-50 p-4 backdrop-blur-sm">

                Dushanba

            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2">Bugun tanaffus bo'ldimi?</h2>
            <p class="text-gray-500 text-sm mb-6">Davom etish uchun javobni tanlang</p>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="selectBreak(true)"

                <button onclick="selectBreak(false)"

                </button>
            </div>
        </div>
    </div>

            nav.innerHTML = '';

            data.forEach(e => {
                let div = document.createElement('div');
                div.className = 'flex items-center gap-[15px] sm:gap-[25px] mb-[12px] p-2 rounded-lg hover:bg-gray-50 transition';

                    </div>
                `;
                nav.append(div);
            });
